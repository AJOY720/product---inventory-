<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Admin Panel</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f6fa;color:#222}.top{background:#222;color:white;padding:18px 22px}
.wrap{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001}.card b{font-size:25px}
.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input,button{padding:11px;border-radius:8px;border:1px solid #ccc}button{cursor:pointer;background:#222;color:white}
table{width:100%;background:white;border-collapse:collapse}.tablewrap{overflow:auto}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
.low{color:#b00020;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:white;padding:22px;border-radius:12px;width:min(420px,90%)}
</style></head>
<body>
<div class="top"><div class="wrap"><h2>Product Inventory — Admin Panel</h2></div></div>
<div class="wrap">
<div class="cards"><div class="card">Products<br><b id="count">0</b></div><div class="card">Units<br><b id="units">0</b></div><div class="card">Stock Value<br><b id="value">₹0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Search product/SKU"><button onclick="openAdd()">+ Add Product</button></div>
<div class="tablewrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Stock</th><th>Sell Price</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<div class="modal" id="modal"><div class="box"><h3>Add Product</h3>
<input id="name" placeholder="Product name"><br><br><input id="sku" placeholder="SKU"><br><br><input id="cat" placeholder="Category"><br><br>
<input id="qty" type="number" placeholder="Stock"><br><br><input id="price" type="number" placeholder="Selling price"><br><br>
<button onclick="save()">Save</button> <button onclick="closeM()">Cancel</button></div></div>
<script>
let products=JSON.parse(localStorage.getItem('inv')||'[]');
function render(){
 let q=document.getElementById('search').value.toLowerCase(), p=products.filter(x=>(x.name+x.sku+x.cat).toLowerCase().includes(q));
 rows.innerHTML=p.map((x,i)=>`<tr><td>${x.name}</td><td>${x.sku}</td><td>${x.cat}</td><td class="${x.qty<=5?'low':''}">${x.qty}</td><td>₹${x.price}</td><td><button onclick="del(${products.indexOf(x)})">Delete</button></td></tr>`).join('');
 count.textContent=products.length; units.textContent=products.reduce((a,x)=>a+x.qty,0);
 value.textContent='₹'+products.reduce((a,x)=>a+x.qty*x.price,0).toFixed(2);
}
function openAdd(){modal.style.display='flex'} function closeM(){modal.style.display='none'}
function save(){products.push({name:name.value,sku:sku.value,cat:cat.value,qty:+qty.value||0,price:+price.value||0});
localStorage.setItem('inv',JSON.stringify(products));['name','sku','cat','qty','price'].forEach(id=>document.getElementById(id).value='');closeM();render()}
function del(i){if(confirm('Delete product?')){products.splice(i,1);localStorage.setItem('inv',JSON.stringify(products));render()}}
search.oninput=render; render();
</script></body></html>
